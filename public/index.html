<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آپلودر من</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#262c3a;--text:#e8ebf2;--mut:#8a93a6;--acc:#6c8cff;--acc2:#a06cff;--red:#ff5c6c;--grn:#3ddc97}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--card:#fff;--line:#e1e5ee;--text:#1b2030;--mut:#6b7488}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
.hide{display:none!important}
.btn{border:0;border-radius:12px;padding:11px 20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;font-weight:700}
.btn:active{transform:scale(.97)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;width:min(360px,100%);text-align:center;box-shadow:0 20px 60px #0004}
#login .logo{font-size:52px}
#login h1{font-size:19px;margin:8px 0 22px}
#login input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:18px;letter-spacing:3px;margin-bottom:14px;outline:none}
#login input:focus{border-color:var(--acc)}
#login .btn{width:100%}
#err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* app */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header h1{font-size:18px;flex:1}
header small{color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:20px}
#drop{border:2px dashed var(--line);border-radius:20px;padding:34px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--card)}
#drop.over,#drop:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
#drop b{display:block;font-size:17px;margin:8px 0 4px}#drop span{color:var(--mut);font-size:13px}
#drop .ic{font-size:40px}
#queue{display:grid;gap:10px;margin-top:14px}
.up{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.up .r{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.up .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:9px;margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
.up .s{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);direction:ltr}
.up.done .bar i{background:var(--grn)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.tools{display:flex;gap:10px;margin:24px 0 14px;align-items:center}
.tools input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.th{position:relative;aspect-ratio:16/10;background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:42px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:auto;width:46px;height:46px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:18px;padding-right:0}
.info{padding:10px 12px}
.info .n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .m{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
.ib{display:flex;gap:4px}
.ib a,.ib button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:15px}
.ib .del:hover{background:var(--red);border-color:var(--red)}
.ib a:hover{background:var(--acc);border-color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
/* modal */
#modal{position:fixed;inset:0;background:#000d;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px}
#stage{width:min(960px,100%);max-height:78vh;display:grid;place-items:center}
#stage video,#stage img{max-width:100%;max-height:78vh;border-radius:12px;background:#000}
#stage audio{width:100%}
#mt{color:#fff;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ma{display:flex;gap:10px}
#ma a,#ma button{width:auto;height:auto;padding:10px 18px;border-radius:12px;border:0;color:#fff;text-decoration:none;cursor:pointer;background:#ffffff22;font-size:14px}
#ma .del{background:var(--red)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:30;font-size:14px}
</style>
</head>
<body>

<div id="login" class="hide">
  <form id="lf">
    <div class="logo">☁️</div>
    <h1>رمز خود را وارد کنید</h1>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button class="btn" type="submit">Ok</button>
    <div id="err"></div>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <h1>☁️ آپلودر من</h1>
    <small id="stat"></small>
    <button class="btn ghost" id="out">خروج</button>
  </header>
  <main>
    <div id="drop">
      <div class="ic">📤</div>
      <b>فایل‌ها رو بکش اینجا یا کلیک کن</b>
      <span>فیلم، عکس، آهنگ، هر فایلی — بدون محدودیت حجم</span>
      <input id="pick" type="file" multiple hidden>
    </div>
    <div id="queue"></div>
    <div class="tools"><input id="q" placeholder="🔍 جستجو در فایل‌ها..."></div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<div id="modal" class="hide">
  <div id="stage"></div>
  <div id="mt"></div>
  <div id="ma"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const MB = b => (b / 1048576).toFixed(1) + ' MB';
const fmt = b => b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : b < 1073741824 ? MB(b) : (b / 1073741824).toFixed(2) + ' GB';
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = m => m.startsWith('video/') ? '🎬' : m.startsWith('image/') ? '🖼️' : m.startsWith('audio/') ? '🎵' : m.includes('pdf') ? '📕' : m.includes('zip') || m.includes('rar') ? '🗜️' : '📄';
let files = [];

function toast(t) { const e = document.createElement('div'); e.id = 'toast'; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 2500); }

/* ---------- auth ---------- */
async function load() {
  const r = await fetch('/api/files');
  if (r.status === 401) { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#pw').focus(); return false; }
  const d = await r.json(); files = d.files;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#stat').textContent = files.length + ' فایل · ' + fmt(d.total);
  render(); return true;
}
$('#lf').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
  if (r.ok) { $('#pw').value = ''; $('#err').textContent = ''; load(); }
  else { $('#err').textContent = (await r.json()).error; const f = $('#lf'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
};
$('#out').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); load(); };

/* ---------- list ---------- */
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = files.filter(f => f.name.toLowerCase().includes(q));
  $('#grid').innerHTML = list.length ? list.map(f => `
    <div class="card" data-id="${f.id}">
      <div class="th" data-open="${f.id}">
        ${f.thumb ? `<img loading="lazy" src="/t/${f.id}" alt="">` : icon(f.mime)}
        ${f.mime.startsWith('video/') || f.mime.startsWith('audio/') ? '<span class="play">▶</span>' : ''}
      </div>
      <div class="info">
        <div class="n" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="m"><span>${fmt(f.size)}</span>
          <div class="ib"><a href="/f/${f.id}?dl=1" title="دانلود">⬇️</a><button class="del" data-del="${f.id}" title="حذف">🗑️</button></div>
        </div>
      </div>
    </div>`).join('') : `<div class="empty" style="grid-column:1/-1">${files.length ? 'چیزی پیدا نشد' : 'هنوز چیزی آپلود نکردی 🌱'}</div>`;
}
$('#q').oninput = render;
$('#grid').onclick = e => {
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
  if (o) openFile(o.dataset.open); else if (d) del(d.dataset.del);
};
async function del(id) {
  const f = files.find(x => x.id === id);
  if (!confirm('«' + f.name + '» حذف بشه؟')) return;
  const r = await fetch('/api/files/' + id, { method: 'DELETE' });
  if (r.ok) { closeModal(); toast('حذف شد'); load(); } else toast('خطا در حذف');
}

/* ---------- player ---------- */
function openFile(id) {
  const f = files.find(x => x.id === id), u = '/f/' + id;
  const st = $('#stage');
  st.innerHTML = f.mime.startsWith('video/') ? `<video src="${u}" controls autoplay playsinline></video>`
    : f.mime.startsWith('audio/') ? `<audio src="${u}" controls autoplay></audio>`
    : f.mime.startsWith('image/') ? `<img src="${u}">`
    : f.mime.includes('pdf') ? `<iframe src="${u}" style="width:100%;height:76vh;border:0;border-radius:12px;background:#fff"></iframe>`
    : `<div style="color:#fff;font-size:60px">${icon(f.mime)}</div>`;
  $('#mt').textContent = f.name + ' · ' + fmt(f.size);
  $('#ma').innerHTML = `<a href="${u}?dl=1">⬇️ دانلود</a><button class="del" data-del="${id}">🗑️ حذف</button>`;
  $('#ma .del').onclick = () => del(id);
  $('#modal').classList.remove('hide');
}
function closeModal() { $('#modal').classList.add('hide'); $('#stage').innerHTML = ''; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- upload ---------- */
$('#drop').onclick = () => $('#pick').click();
$('#pick').onchange = e => { add([...e.target.files]); e.target.value = ''; };
['dragover', 'dragenter'].forEach(t => $('#drop').addEventListener(t, e => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(t => $('#drop').addEventListener(t, e => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', e => add([...e.dataTransfer.files]));

const jobs = []; let busy = false;
function add(list) { list.forEach(f => jobs.push(f)); if (!busy) run(); }
addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });

function makeThumb(file) {
  return new Promise(res => {
    const v = file.type.startsWith('video/'), i = file.type.startsWith('image/');
    if (!v && !i) return res(null);
    const url = URL.createObjectURL(file), el = document.createElement(v ? 'video' : 'img');
    const done = b => { URL.revokeObjectURL(url); res(b); };
    const draw = () => {
      try {
        const w = el.videoWidth || el.naturalWidth, h = el.videoHeight || el.naturalHeight;
        if (!w) return done(null);
        const s = Math.min(1, 480 / w), c = document.createElement('canvas');
        c.width = w * s; c.height = h * s;
        c.getContext('2d').drawImage(el, 0, 0, c.width, c.height);
        c.toBlob(done, 'image/jpeg', .8);
      } catch { done(null); }
    };
    setTimeout(() => done(null), 8000);
    el.onerror = () => done(null);
    if (v) { el.muted = true; el.preload = 'metadata'; el.playsInline = true; el.onloadedmetadata = () => { el.currentTime = Math.min(2, (el.duration || 2) / 4); }; el.onseeked = draw; }
    else el.onload = draw;
    el.src = url;
  });
}

async function run() {
  busy = true;
  while (jobs.length) await send(jobs.shift());
  busy = false; load();
}

function send(file) {
  return new Promise(async resolve => {
    const el = document.createElement('div'); el.className = 'up';
    el.innerHTML = `<div class="r"><span class="n">${esc(file.name)}</span><button class="x">✕</button></div>
      <div class="bar"><i></i></div><div class="s"><span class="a">preparing…</span><span class="b"></span></div>`;
    $('#queue').prepend(el);
    const bar = el.querySelector('i'), a = el.querySelector('.a'), b = el.querySelector('.b');
    const fd = new FormData();
    fd.append('name', file.name); fd.append('mime', file.type || 'application/octet-stream');
    const th = await makeThumb(file); if (th) fd.append('thumb', th, 't.jpg');
    fd.append('file', file);
    const xhr = new XMLHttpRequest(); const t0 = Date.now();
    el.querySelector('.x').onclick = () => { xhr.abort(); el.remove(); };
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total * 100, sp = e.loaded / ((Date.now() - t0) / 1000 || 1);
      bar.style.width = p + '%';
      a.textContent = p.toFixed(0) + '%  —  ' + MB(e.loaded) + ' / ' + MB(e.total);
      b.textContent = MB(sp) + '/s';
    };
    xhr.onload = () => {
      if (xhr.status === 200) { bar.style.width = '100%'; el.classList.add('done'); a.textContent = '✔ 100%  —  ' + MB(file.size); b.textContent = ''; setTimeout(() => el.remove(), 3000); }
      else { a.textContent = '❌ خطا در آپلود'; b.textContent = ''; }
      resolve();
    };
    xhr.onerror = () => { a.textContent = '❌ قطع شد'; resolve(); };
    xhr.onabort = () => resolve();
    xhr.open('POST', '/api/upload'); xhr.send(fd);
  });
}

load();
</script>
</body>
</html>
